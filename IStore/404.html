<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/x-icon" href="favicons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3450E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="iStore Sophi">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — iStore by Sophi</title>
<meta name="description" content="The page you're looking for doesn't exist. Head back to iStore by Sophi to keep browsing genuine Apple products in Addis Ababa.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent: #3450E0;
    --accent-light: #7288F0;
    --accent-pale: #E9EDFC;
    --accent-dark: #1E32AE;
    --ink-strong: #14161C;
    --paper: #F5F6F8;
    --mist-50: #EFF1F4;
    --mist-100: #E6E9EE;
    --line: #D9DCE4;
    --ink: #14161C;
    --ink-mid: #4A4F5C;
    --ink-soft: #666C7A; /* darkened from #878D9C for WCAG AA contrast (was 3.32:1, now 5.26:1) */
  }

  html { scroll-behavior: smooth; overflow-x: hidden; max-width: 100%; }

  .skip-link {
    position: absolute;
    top: -100px;
    left: 1rem;
    z-index: 1000;
    background: var(--accent);
    color: #fff;
    padding: 0.75rem 1.25rem;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: top 0.2s ease;
  }
  .skip-link:focus { top: 1rem; }

  a:focus-visible,
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible,
  select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--paper);
    color: var(--ink);
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1.2rem 3rem;
    background: rgba(245,246,248,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--line);
  }

  .nav-logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    color: var(--ink);
    letter-spacing: 0.04em;
    text-decoration: none;
  }
  .nav-logo span { color: var(--accent); font-weight: 500; font-size: 0.85em; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8rem 1.5rem 4rem;
  }

  .error-content {
    text-align: center;
    max-width: 480px;
  }

  .error-code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(4rem, 12vw, 7rem);
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .error-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--ink);
    margin-top: 1rem;
  }

  .error-desc {
    font-size: 0.95rem;
    color: var(--ink-mid);
    line-height: 1.6;
    margin-top: 0.75rem;
    margin-bottom: 2.25rem;
  }

  .error-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--paper);
    padding: 0.85rem 1.75rem;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: var(--accent); }

  .btn-outline {
    background: transparent;
    color: var(--ink);
    padding: 0.85rem 1.75rem;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    border: 1px solid var(--line);
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

  footer {
    padding: 2rem 3rem;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-soft);
  }

  @media (max-width: 600px) {
    nav { padding: 1rem 1.5rem; }
    footer { padding: 1.5rem; }
  }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<nav>
  <a href="istore.html" class="nav-logo">iStore <span>by Sophi</span></a>
</nav>

<main id="main">
  <div class="error-content">
    <div class="error-code">404</div>
    <h1 class="error-title">This page doesn't exist</h1>
    <p class="error-desc">The link may be broken, or the page may have moved. Let's get you back to browsing genuine Apple products.</p>
    <div class="error-actions">
      <a href="istore.html" class="btn-primary">Back to homepage</a>
      <a href="products.html" class="btn-outline">Shop products</a>
    </div>
  </div>
</main>

<footer>© <span id="footer-year"></span> iStore by Sophi. All rights reserved.</footer>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
